/* ---------- cursor FX ---------- */
#orb,#orb2{position:fixed;top:0;left:0;pointer-events:none;z-index:9999;border-radius:50%;

#orb{width:420px;height:420px;margin:-210px 0 0 -210px;

.fx{position:relative;isolation:isolate}

.fx>*{position:relative;z-index:2}

}

<script>
/* ================= state ================= */
const K={d:'hbx_d1',u:'hbx_u1',s:'hbx_s1',p:'hbx_p1'};
let DATA=ls(K.d)||JSON.parse(JSON.stringify(DEFAULT_DATA));
let USERS=ls(K.u)||[];
let DONE=ls(K.p)||[];
let isAdmin=false,tab='modules',openMod=null,chip='All',DIRTY=0;

// warn if you close the tab with edits that were never published
addEventListener('beforeunload',e=>{ if(isAdmin&&DIRTY>0){ e.preventDefault(); e.returnValue=''; } });

function ls(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function save(){localStorage.setItem(K.d,JSON.stringify(DATA));DIRTY++;}
function saveU(){localStorage.setItem(K.u,JSON.stringify(USERS))}
function saveP(){localStorage.setItem(K.p,JSON.stringify(DONE))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

/* ================= cursor FX ================= */
(function(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  if(matchMedia('(hover:none)').matches) return;
  const a=document.getElementById('orb'),b=document.getElementById('orb2');
  let tx=innerWidth/2,ty=innerHeight/2,ax=tx,ay=ty,bx=tx,by=ty;
  addEventListener('pointermove',e=>{
    tx=e.clientX;ty=e.clientY;document.body.classList.add('fx');
    const c=e.target.closest && e.target.closest('.fx');
    if(c){const r=c.getBoundingClientRect();
      c.style.setProperty('--mx',(e.clientX-r.left)+'px');
      c.style.setProperty('--my',(e.clientY-r.top)+'px');}
  },{passive:true});
  addEventListener('pointerleave',()=>document.body.classList.remove('fx'));
  (function loop(){
    ax+=(tx-ax)*.07; ay+=(ty-ay)*.07;
    bx+=(tx-bx)*.26; by+=(ty-by)*.26;
    a.style.transform='translate3d('+ax+'px,'+ay+'px,0)';
    b.style.transform='translate3d('+bx+'px,'+by+'px,0)';
    requestAnimationFrame(loop);
  })();
})();

/* ================= embeds ================= */
function toEmbed(u){
  if(!u)return'';u=u.trim();let m;
  if(m=u.match(/youtu\.be\/([\w-]{6,})/))                return'https://www.youtube.com/embed/'+m[1];
  if(m=u.match(/youtube\.com\/.*[?&]v=([\w-]{6,})/))     return'https://www.youtube.com/embed/'+m[1];
  if(m=u.match(/youtube\.com\/(?:shorts|embed)\/([\w-]{6,})/)) return'https://www.youtube.com/embed/'+m[1];
  if(m=u.match(/loom\.com\/(?:share|embed)\/([\w-]+)/))   return'https://www.loom.com/embed/'+m[1];
  if(m=u.match(/fathom\.video\/(?:share|calls|embed)\/([\w-]+)/)) return'https://fathom.video/embed/'+m[1];
  if(m=u.match(/vimeo\.com\/(\d+)/))                      return'https://player.vimeo.com/video/'+m[1];
  if(m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))  return'https://drive.google.com/file/d/'+m[1]+'/preview';
  return u;
}

/* ================= supabase (optional) ================= */
let SB=null;
const cloud=()=>!!SB;

async function initSB(){
  if(!SUPABASE.URL||!SUPABASE.ANON_KEY) return;
  await new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
    s.onload=res; s.onerror=rej; document.head.appendChild(s);
  }).catch(()=>{});
  if(window.supabase&&window.supabase.createClient){
    SB=window.supabase.createClient(SUPABASE.URL,SUPABASE.ANON_KEY);
  }
}
function sbUser(u){
  const md=u.user_metadata||{};
  return {name:md.name||u.email.split('@')[0],email:u.email,done:Array.isArray(md.done)?md.done:[]};
}

/* ================= gate ================= */
async function boot(){
  ['gBrand','aBrand','mBrand'].forEach(i=>document.getElementById(i).textContent=CONFIG.BRAND);
  ['gMark','aMark','mMark'].forEach(i=>document.getElementById(i).textContent=CONFIG.MARK);
  ['gKick','aKick'].forEach(i=>document.getElementById(i).textContent=CONFIG.KICKER);
  document.title=CONFIG.BRAND;

  // stay logged in between visits
  const s=ls(K.s);
  if(s&&s.h){
    const mem=(DATA.members||[]).find(x=>x.hash===s.h);
    if(mem) return enter({name:mem.label||'Member', email:'', done:mem.done||[]});
    localStorage.removeItem(K.s); // access was revoked
  }
}
/* one-way hash of email+password. the public file only ever holds this. */
const SALT='hiab.v1.';
async function credHash(email,pass){
  const raw=SALT+String(email).trim().toLowerCase()+':'+String(pass);
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function doLogin(){
  const e=document.getElementById('eL');e.className='err';e.textContent='';
  const m=document.getElementById('liE').value.trim().toLowerCase(),
        p=document.getElementById('liP').value;
  if(!m||!p)return e.textContent='Enter your email and password.';

  const h=await credHash(m,p);
  const mem=(DATA.members||[]).find(x=>x.hash===h);
  if(!mem)return e.textContent="Those details don't match an account. Check the message we sent you, or DM us and we'll sort it.";

  localStorage.setItem(K.s,JSON.stringify({h}));
  enter({name:mem.label||'Member', email:m, done:mem.done||[]});
}
function askAdmin(){
  modal({title:'Admin mode',help:'Skips checkout and login so you can edit the portal.',
    fields:[{k:'pw',l:'Password',type:'password'}],cta:'Enter',
    onOk:v=>{ if(v.pw!==CONFIG.ADMIN_PASS)return'Wrong password.';
      isAdmin=true;document.body.classList.add('admin');
      enter({name:'Admin',email:'admin mode',pass:''}); }});
}
function enter(u){
  if(cloud()&&Array.isArray(u.done))DONE=u.done;
  document.getElementById('gate').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  document.getElementById('whoN').textContent=u.name;
  document.getElementById('whoE').textContent=u.email;
  document.getElementById('avI').textContent=(u.name||'?').trim().charAt(0).toUpperCase();
  render();
}
async function logout(){
  if(cloud()&&!isAdmin){ try{ await SB.auth.signOut(); }catch(e){} }
  localStorage.removeItem(K.s);isAdmin=false;document.body.classList.remove('admin');
  document.getElementById('app').classList.add('hide');
  document.getElementById('gate').classList.remove('hide');scrollTo(0,0);
}

/* ================= nav ================= */
function go(t){
  tab=t;openMod=null;
  document.querySelectorAll('.navi,.mtabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  render();scrollTo(0,0);

function render(){
  const v=document.getElementById('view');
  const bar='<div id="abar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:16px;height:16px"><path d="M12 3l8 4v6c0 4-3.5 7-8 8-4.5-1-8-4-8-8V7l8-4z"/></svg>'+
    '<span class="sp">'+(ghCfg()
      ? (DIRTY>0
          ? '<b>'+DIRTY+' change'+(DIRTY===1?'':'s')+' not published yet.</b> Nobody else can see them until you hit Publish.'
          : '<b>Admin mode.</b> Everything is published. Make an edit and a Publish button appears here.')
      : '<b>Admin mode. Edits are NOT live.</b> Fill in the GITHUB block at the top of this file to enable one-click publishing, or use Export site data.')+
    '</span>'+
    (ghCfg()&&DIRTY>0?'<button onclick="publish(this)">Publish changes</button>':'')+
    '<button onclick="resetLocal()">Reload published</button>'+
    '<button onclick="exportData()">Export site data</button><button onclick="logout()">Exit</button></div>';
  v.innerHTML=bar+({modules:vModules,recordings:vRec,assets:vAssets,community:vComm,members:vMembers}[tab]||vModules)();
  updProg();
  v.querySelectorAll('.mod,.asset,.cbox,.row').forEach((el,i)=>{
    el.classList.add('up','fx'); el.style.animationDelay=Math.min(i*.035,.3)+'s';
  });
}
function head(k,t,s){return '<div class="phead"><span class="kicker">'+esc(k)+'</span><h2>'+esc(t)+'</h2><p>'+esc(s)+'</p></div>'}
function updProg(){
  const n=DONE.length,t=DATA.modules.length;
  const a=document.getElementById('progTxt'),b=document.getElementById('progBar');
  if(a)a.textContent=n+' / '+t;
  if(b)b.style.width=(t?Math.round(n/t*100):0)+'%';

function vModules(){
  let h=head('The LAUNCH Path','Modules','Work them in order. The order is the whole point.'),last=null;
  DATA.modules.forEach((m,i)=>{
    if(m.part!==last){last=m.part;
      const num=['One','Two','Three'][[...new Set(DATA.modules.map(x=>x.part))].indexOf(m.part)]||'';
      h+='<div class="partband"><span class="pn">Part '+num+'</span><span class="pl">'+esc(m.part)+'</span><span class="ln"></span></div>';}
    const o=openMod===i,done=DONE.includes(m.n);
    h+='<div class="mod'+(o?' open':'')+'">'+
      '<div class="mhead" onclick="tog('+i+')">'+
        '<span class="mno">MODULE '+String(m.n).padStart(2,'0')+'</span>'+
        '<div class="mtitle"><b>'+esc(m.title)+'</b><span>'+esc(m.sub)+'</span></div>'+
        '<span class="pill'+(done?' on':'')+'">'+(done?'Done':(m.video?'Ready':'No video'))+'</span>'+
        '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>'+
      '</div>';
    if(o){
      h+='<div class="mbody">';
      h+= m.video
        ? '<div class="vwrap"><iframe src="'+esc(toEmbed(m.video))+'" allowfullscreen allow="fullscreen; picture-in-picture"></iframe></div>'
        : '<div class="vempty"><b>No video on this module yet</b><span class="tiny">'+(isAdmin?'Use Set video below':'It will appear here after the call')+'</span></div>';
      if(isAdmin)h+='<button class="btn ghost sm adm" style="margin-top:10px" onclick="edVid('+i+')">Set video</button>';
      if(m.points&&m.points.length)h+='<h4>What\'s covered</h4><ul class="plist">'+m.points.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul>';
      if(m.prompt)h+='<h4>Copy-paste AI prompt</h4><div class="prompt"><button class="copy" onclick="cpP('+i+')">Copy</button><pre>'+esc(m.prompt)+'</pre></div>';
      if(m.call)h+='<div class="callbox"><h4 style="margin-top:0">What to cover on the call</h4><p class="muted">'+esc(m.call)+'</p></div>';
      h+='<div class="doneRow"><button class="btn '+(done?'ghost':'')+' sm" onclick="mark('+m.n+')">'+
         (done?'Mark not done':'Mark complete')+'</button><span class="tiny">'+DONE.length+' of '+DATA.modules.length+' complete</span></div>';
      h+='</div>';
    }
    h+='</div>';
  });
  h+='<div class="discl"><b>About the AI prompts.</b> They help you research and draft faster. Anything to do with your state\'s licensing, Medicaid rules, reimbursement rates or compliance deadlines must be confirmed directly with your state agency or a licensed professional. Never file or submit anything based on an AI answer alone.</div>';
  return h;
}
function tog(i){openMod=openMod===i?null:i;render()}
function mark(n){
  const i=DONE.indexOf(n); i<0?DONE.push(n):DONE.splice(i,1);
  saveP();
  if(cloud()&&!isAdmin){ SB.auth.updateUser({data:{done:DONE}}).catch(()=>{}); }
  render(); toast(i<0?'Nice. Module complete.':'Unmarked');
}
function cpP(i){navigator.clipboard.writeText(DATA.modules[i].prompt).then(()=>toast('Prompt copied'))}
function edVid(i){modal({title:'Module video',help:'Paste a Loom, Fathom, YouTube, Vimeo or Drive link. It converts to an embed automatically.',
  fields:[{k:'u',l:'Video link',val:DATA.modules[i].video}],cta:'Save',
  onOk:v=>{DATA.modules[i].video=v.u.trim();save();render()}})}

/* ================= recordings ================= */
function vRec(){
  let h=head('Call library','Recordings','Every coaching call in one place.');
  if(isAdmin)h+='<button class="btn sm adm" style="margin-bottom:16px" onclick="addRec()">+ Add recording</button>';
  if(!DATA.recordings.length)return h+'<div class="empty">Nothing here yet.'+(isAdmin?' Use Add recording above.':' Recordings appear after each call.')+'</div>';

      (isAdmin?'<button class="btn ghost sm adm" onclick="del(\'recordings\','+i+')">Remove</button>':'')+'</div>';
  });

}
function addRec(){modal({title:'Add recording',fields:[{k:'title',l:'Title'},{k:'date',l:'Date'},{k:'url',l:'Link'}],
  cta:'Add',onOk:v=>{if(!v.title)return'Give it a title.';DATA.recordings.push(v);save();render()}})}

  h+='<div class="chips">'+cats.map(c=>'<button class="chip'+(chip===c?' on':'')+'" onclick="setChip(\''+esc(c)+'\')">'+esc(c)+'</button>').join('')+'</div>';

    if(chip!=='All'&&(a.cat||'Other')!==chip)return;

      (a.url?'<a class="btn sm" style="flex:1;text-align:center" href="'+esc(a.url)+'" target="_blank" rel="noopener">Open</a>'
            :'<span class="pill">Coming soon</span>')+

function edAsset(i){

  modal({title:i<0?'Add asset':'Edit asset',
    fields:[{k:'name',l:'Name',val:a.name},{k:'cat',l:'Category',val:a.cat},{k:'ico',l:'Emoji',val:a.ico},
            {k:'url',l:'Link (Notion, Drive, PDF)',val:a.url},{k:'desc',l:'One-line description',val:a.desc,ta:1}],

    onOk:v=>{if(!v.name)return'Give it a name.';
      const o={name:v.name,cat:v.cat||'Other',ico:v.ico||'📄',url:v.url,desc:v.desc};
      i<0?DATA.assets.push(o):DATA.assets[i]=o;save();render();}});

/* ================= members (admin only) ================= */
function vMembers(){
  if(!isAdmin) return head('','Members','Admin only.')+'<div class="empty">Not available.</div>';
  const M=DATA.members||[];
  let h=head('Access','Members','You create every account by hand. Nobody can sign themselves up.');
  h+='<button class="btn sm" style="margin-bottom:16px" onclick="addMember()">+ Create member account</button>';
  if(!M.length) h+='<div class="empty">No members yet. Create one after someone pays.</div>';
  else M.forEach((m,i)=>{
    h+='<div class="row"><div class="rt"><b>'+esc(m.label||'Member')+'</b>'+
      '<span>added '+esc((m.added||'').slice(0,10))+'</span></div>'+
      '<button class="btn ghost sm" onclick="delMember('+i+')">Revoke access</button></div>';
  });
  h+='<div class="discl"><b>How this stays private.</b> Only a label and a one-way hash of the email and password are saved. '+
     'The email address and the password are never stored anywhere in this file, so nothing sensitive ends up in the public repo. '+
     'That also means you cannot look a password up later. If someone loses theirs, revoke the account and create a new one.<br><br>'+
     '<b>Remember to Publish.</b> A new account only works on the member\'s device after you hit Publish changes.</div>';
  return h;
}

function rndPass(){
  const a='abcdefghijkmnopqrstuvwxyz', n='23456789';
  const p=c=>c[Math.floor(Math.random()*c.length)];
  return [0,1,2,3,4,5].map(()=>p(a)).join('')+'-'+[0,1,2,3].map(()=>p(n)).join('');
}

function addMember(){
  const pass=rndPass();
  modal({title:'Create member account',
    help:'Label is just for you. The email and password below are what you send them.',
    fields:[
      {k:'label',l:'Label (e.g. Renee T.)'},
      {k:'email',l:'Their email'},
      {k:'pass', l:'Password', val:pass}
    ],
    cta:'Create',
    onOk:v=>{
      const lab=(v.label||'').trim(), em=(v.email||'').trim().toLowerCase(), pw=(v.pass||'').trim();
      if(!lab) return 'Give it a label so you know who it is.';
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) return 'That email does not look right.';
      if(pw.length<6) return 'Password needs at least 6 characters.';
      credHash(em,pw).then(async h=>{
        if((DATA.members||[]).some(x=>x.hash===h)){ toast('That exact email and password already exists.'); return; }
        DATA.members=DATA.members||[];
        DATA.members.push({label:lab, hash:h, added:new Date().toISOString(), done:[]});
        save(); render();

        // An account that is not published does not exist for anybody else,
        // so push it live BEFORE handing over the credentials.
        if(ghCfg()){
          toast('Publishing the new account...');
          const ok=await publish(null);
          if(!ok){
            modal({title:'Account created but NOT live yet',
              help:'The account is saved in this browser but the publish to GitHub did not go through, so '+lab+' cannot log in yet. Fix the error above, then hit Publish changes. Do not send them their password until it has published.',
              fields:[], cta:'OK', onOk:()=>{}});
            return;
          }
        }
        setTimeout(()=>showCreds(lab,em,pw),60);
      });
    }});
}

function showCreds(lab,em,pw){
  const site=location.origin+location.pathname;
  const txt="You're in. Here's your login for Healthcare in a Box:\n\n"+
    site+"\n\nEmail: "+em+"\nPassword: "+pw+"\n\nLog in and start with Module 1. Any trouble, just message me.";
  modal({title:'Live. Account created for '+lab,
    help:'Published to GitHub, so this login works on any device in about 30 seconds. Copy the message and send it. This is the only time you will see the password.',
    fields:[{k:'m',l:'Message to send',val:txt,ta:1}],
    cta:'Copy and close',
    onOk:v=>{ navigator.clipboard.writeText(v.m).then(()=>toast('Copied. Now hit Publish changes.')); }});
}

function delMember(i){
  const m=DATA.members[i];
  modal({title:'Revoke access?', help:'This removes '+(m.label||'this member')+'. They will be logged out and cannot get back in. It cannot be undone.',
    fields:[], cta:'Revoke',
    onOk:()=>{
      DATA.members.splice(i,1); save(); render();
      if(ghCfg()) publish(null).then(ok=>toast(ok?'Revoked and published.':'Removed here, but the publish failed. Hit Publish changes.'));
      else toast('Revoked. Hit Publish changes to make it stick.');
    }});
}

function cbox(t,s,btn,extra){
  return '<div class="cbox"><h3>'+esc(t)+'</h3><p class="cs">'+esc(s)+'</p>'+
    (btn?'<a class="btn wide" href="'+esc(btn.u)+'" target="_blank" rel="noopener">'+esc(btn.t)+'</a>':'')+
    (!btn&&!extra?'<span class="pill">Not set up yet</span>':'')+(extra||'')+'</div>';
}

/* ================= modal / toast / export ================= */
function modal(o){
  const host=document.getElementById('modalHost');
  host.innerHTML='<div class="mbg" id="mbg"><div class="msheet"><h3>'+esc(o.title)+'</h3>'+
    (o.help?'<p class="ms">'+esc(o.help)+'</p>':'')+'<div id="mErr"></div>'+
    o.fields.map((f,i)=>'<label class="lbl">'+esc(f.l)+'</label>'+
      (f.ta?'<textarea class="field" id="mf'+i+'">'+esc(f.val||'')+'</textarea>'
           :'<input class="field" id="mf'+i+'" type="'+(f.type||'text')+'" value="'+esc(f.val||'')+'">')).join('')+
    '<div class="mrow"><button class="btn" style="flex:1" id="mOk">'+esc(o.cta||'Save')+'</button>'+
    '<button class="btn ghost" id="mX">Cancel</button>'+
    (o.extra?'<button class="btn ghost" id="mE">'+esc(o.extra.label)+'</button>':'')+'</div></div></div>';
  const close=()=>host.innerHTML='';
  document.getElementById('mX').onclick=close;
  document.getElementById('mbg').onclick=e=>{if(e.target.id==='mbg')close()};
  if(o.extra)document.getElementById('mE').onclick=()=>{o.extra.fn();close()};
  document.getElementById('mOk').onclick=()=>{
    const v={};o.fields.forEach((f,i)=>v[f.k]=document.getElementById('mf'+i).value);
    const err=o.onOk(v);
    if(err){const e=document.getElementById('mErr');e.className='err';e.textContent=err;return}
    close();
  };
  const f=document.getElementById('mf0');if(f)f.focus();
  addEventListener('keydown',function esc2(e){if(e.key==='Escape'){close();removeEventListener('keydown',esc2)}});
}
let tt;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2000)}
/* Your browser keeps its own working copy of the data. After you upload a new
   version of this file by hand, that cached copy is what you still see. This
   throws it away and loads whatever is actually published. */

  modal({title:'Reload the published version?',
    help:'This discards any unpublished edits in this browser and loads exactly what is live in the file. Use it after uploading a new version by hand.',
    fields:[], cta:'Reload',
    onOk:()=>{ localStorage.removeItem(K.d); location.reload(); }});
}

/* ================= github publishing ================= */
const TOK_KEY='hbx_ghtok';
function ghCfg(){ return !!(typeof GITHUB!=='undefined' && GITHUB.OWNER && GITHUB.REPO); }
function ghTok(){ try{ return sessionStorage.getItem(TOK_KEY)||''; }catch(e){ return ''; } }

function b64enc(s){
  const bytes=new TextEncoder().encode(s);
  let bin=''; for(const b of bytes) bin+=String.fromCharCode(b);
  return btoa(bin);
}
function b64dec(b64){
  const bin=atob(String(b64).replace(/\s/g,''));
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

function askToken(then){
  modal({title:'GitHub token',
    help:'Paste your fine-grained token. It stays in this browser tab only, is never written into the file, and is gone when you close the tab.',
    fields:[{k:'t',l:'Token',type:'password'}], cta:'Use for this session',
    onOk:v=>{
      const t=(v.t||'').trim();
      if(!t) return 'Paste the token.';
      try{ sessionStorage.setItem(TOK_KEY,t); }catch(e){}
      if(then) setTimeout(then,0);
    }});
}

function pubFail(msg){
  modal({title:'Publish failed', help:msg+'  Your edits are still here, nothing was lost. Try again, or use Export site data as a fallback.',
    fields:[], cta:'OK', onOk:()=>{}});
}

async function publish(btn){
  if(!ghCfg()){ modal({title:'GitHub not set up yet',
    help:'Open this file, find the GITHUB block near the top, and fill in OWNER and REPO. Then reload and try again.',
    fields:[], cta:'OK', onOk:()=>{}}); return false; }

  let tok=ghTok();
  if(!tok){
    tok=await new Promise(res=>askToken(()=>res(ghTok())));
    if(!tok) return false;
  }

  const set=t=>{ if(btn) btn.textContent=t; };
  const api='https://api.github.com/repos/'+GITHUB.OWNER+'/'+GITHUB.REPO+'/contents/'+GITHUB.PATH;
  const h={Authorization:'Bearer '+tok, Accept:'application/vnd.github+json'};
  set('Publishing...');

  try{
    const g=await fetch(api+(GITHUB.BRANCH?'?ref='+encodeURIComponent(GITHUB.BRANCH):''),{headers:h});
    if(g.status===401||g.status===403){
      try{ sessionStorage.removeItem(TOK_KEY); }catch(e){}
      throw new Error('GitHub rejected that token. Check it has not expired and that it has Contents: Read and write on this repo. You will be asked for it again next time.');
    }
    if(g.status===404) throw new Error('Could not find '+GITHUB.OWNER+'/'+GITHUB.REPO+'/'+GITHUB.PATH+' on branch '+GITHUB.BRANCH+'. Check the GITHUB block at the top of this file.');
    if(!g.ok) throw new Error('GitHub returned '+g.status+' when reading the file.');

    const meta=await g.json();
    const src=b64dec(meta.content);
    const marks=/\/\* DATA_START \*\/[\s\S]*?\/\* DATA_END \*\//;
    if(!marks.test(src)) throw new Error('The live file does not have the DATA_START marker in it, so there is nothing safe to replace. It is probably an older copy. Upload this version once by hand, then publishing will work from then on.');

    // built piecewise on purpose, so the literal markers never appear in this file twice
    const M1='/*'+' DATA_START '+'*/', M2='/*'+' DATA_END '+'*/';
    const block=M1+'\nconst DEFAULT_DATA = '+JSON.stringify(DATA,null,2)+';\n'+M2;
    const out=src.replace(marks,()=>block);

    const msg='Portal update: '+DATA.modules.filter(m=>m.video).length+' videos, '+
      DATA.assets.length+' assets, '+DATA.recordings.length+' recordings, '+DATA.calls.length+' calls';

    const body={message:msg, content:b64enc(out), sha:meta.sha};
    if(GITHUB.BRANCH) body.branch=GITHUB.BRANCH;

    const p=await fetch(api,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},h),body:JSON.stringify(body)});
    if(p.status===409) throw new Error('The file changed on GitHub since this page loaded. Hit Publish once more and it will pick up the newer version.');
    if(!p.ok){
      let m='GitHub returned '+p.status+' when saving.';
      try{ const e=await p.json(); if(e && e.message) m=e.message; }catch(e){}
      throw new Error(m);
    }

    DIRTY=0;
    toast('Published. Live in about 30 seconds.');
    render();
    return true;
  }catch(e){
    set('Publish changes');
    pubFail(e.message||'Something went wrong talking to GitHub.');
    return false;
  }
}

function exportData(){
  const out='const DEFAULT_DATA = '+JSON.stringify(DATA,null,2)+';';
  navigator.clipboard.writeText(out).then(()=>{
    modal({title:'Copied to your clipboard',
      help:'Open this HTML file, find the DEFAULT_DATA block near the top, and replace the whole block with what you just copied. Save, re-upload, and every member sees the change.',
      fields:[],cta:'Got it',onOk:()=>{}});
  }).catch(()=>{
    modal({title:'Copy this manually',help:'Select all, copy, then paste over the DEFAULT_DATA block.',
      fields:[{k:'x',l:'Site data',val:out,ta:1}],cta:'Done',onOk:()=>{}});
  });
}

boot();
